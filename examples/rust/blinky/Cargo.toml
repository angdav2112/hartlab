[package]
name = "blinky"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "PolarFire Icicle LED blinky for HartLab (U54_1, GPIO2 16-19)"

# Teaching ELF: keep DWARF so the playground can highlight rust_main.
# opt-level = "s" + LTO left almost no .debug_info (review 2026-08-18).
[profile.release]
opt-level = 1
lto = false
codegen-units = 1
panic = "abort"
debug = 2
strip = false

[profile.dev]
panic = "abort"
debug = 2
